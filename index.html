<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Happy Birthday Website 2.0 | Aoudumber Bade" />
    <meta name="github" content="https://github.com/Aoudumber-Bade" />
    <title>Birthday Gift Animation | webkaizen</title>
    <link rel="icon" type="image/png" href="./Images/smiley_icon.png" />
    <link rel="shortcut icon" type="image/png" href="./Images/smiley_icon.png" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <!-- Floating sparkle cursor effect -->
    <script type="text/javascript">
      var colours = [
        "#ffd166",
        "#06d6a0",
        "#118ab2",
        "#f77f00",
        "#ffffff",
        "#4cc9f0",
      ];
      var minisize = 16;
      var maxisize = 28;
      var sparkles = 56;
      var over_or_under = "over";

      var x = (ox = 400);
      var y = (oy = 300);
      var swide = 800;
      var shigh = 600;
      var sleft = (sdown = 0);
      var sparkleNodes = [];
      var sparklex = [];
      var sparkley = [];
      var sparklesize = [];
      var sparkleBurst = false;

      if (typeof "addRVLoadEvent" != "function")
        function addRVLoadEvent(funky) {
          var oldonload = window.onload;
          if (typeof oldonload != "function") window.onload = funky;
          else
            window.onload = function () {
              if (oldonload) oldonload();
              funky();
            };
        }

      addRVLoadEvent(startSparkles);

      function startSparkles() {
        if (document.getElementById) {
          var i, sparkle;
          for (i = 0; i < sparkles; i++) {
            sparkle = createDiv("auto", "auto");
            sparkle.style.visibility = "hidden";
            sparkle.style.zIndex = over_or_under == "over" ? "1001" : "0";
            sparkle.style.color = colours[i % colours.length];
            sparkle.style.pointerEvents = "none";
            sparkle.style.opacity = 0.85;
            sparkle.style.textShadow = "0 0 10px currentColor";
            sparkle.appendChild(
              document.createTextNode(
                i % 3 === 0
                  ? String.fromCharCode(10022)
                  : String.fromCharCode(8226),
              ),
            );
            document.body.appendChild(sparkle);
            sparkleNodes[i] = sparkle;
            sparkley[i] = false;
          }
          set_scroll();
          set_width();
          sparkleTrail();
        }
      }

      function sparkleTrail() {
        var c;
        if (Math.abs(x - ox) > 1 || Math.abs(y - oy) > 1) {
          ox = x;
          oy = y;
          for (c = 0; c < sparkles; c++)
            if (sparkley[c] === false) {
              sparkleNodes[c].firstChild.nodeValue =
                c % 3 === 0
                  ? String.fromCharCode(10022)
                  : String.fromCharCode(8226);
              sparkleNodes[c].style.left = (sparklex[c] = x - minisize / 2) + "px";
              sparkleNodes[c].style.top = (sparkley[c] = y - minisize) + "px";
              sparkleNodes[c].style.fontSize = minisize + "px";
              sparkleNodes[c].style.fontWeight = "bold";
              sparkleNodes[c].style.visibility = "visible";
              sparklesize[c] = minisize;
              break;
            }
        }
        for (c = 0; c < sparkles; c++) if (sparkley[c] !== false) floatSparkle(c);
        setTimeout(sparkleTrail, 40);
      }

      document.onmousedown = sparkleClick;
      document.onmouseup = function () {
        clearTimeout(sparkleBurst);
      };

      function sparkleClick() {
        ox = -1;
        oy = -1;
        sparkleBurst = setTimeout(sparkleClick, 100);
      }

      function floatSparkle(i) {
        sparkley[i] -= sparklesize[i] / minisize + (i % 2);
        sparklex[i] += ((i % 5) - 2) / 4;
        if (
          sparkley[i] < sdown - sparklesize[i] ||
          sparklex[i] < sleft - sparklesize[i] ||
          sparklex[i] > sleft + swide - sparklesize[i]
        ) {
          sparkleNodes[i].style.visibility = "hidden";
          sparkley[i] = false;
        } else if (sparklesize[i] > minisize + 2 && Math.random() < 0.5 / sparkles)
          popSparkle(i);
        else {
          if (Math.random() < maxisize / sparkley[i] && sparklesize[i] < maxisize)
            sparkleNodes[i].style.fontSize = ++sparklesize[i] + "px";
          sparkleNodes[i].style.top = sparkley[i] + "px";
          sparkleNodes[i].style.left = sparklex[i] + "px";
        }
      }

      function popSparkle(i) {
        sparkleNodes[i].firstChild.nodeValue = String.fromCharCode(10038);
        sparkleNodes[i].style.fontWeight = "bold";
        sparkley[i] = false;
        setTimeout(() => (sparkleNodes[i].style.visibility = "hidden"), 400);
      }

      document.onmousemove = mouse;
      function mouse(e) {
        if (e) {
          y = e.pageY;
          x = e.pageX;
        } else {
          set_scroll();
          y = event.y + sdown;
          x = event.x + sleft;
        }
      }

      window.onresize = set_width;
      function set_width() {
        var sw_min =
          window.innerWidth ||
          document.documentElement.clientWidth ||
          document.body.clientWidth;
        var sh_min =
          window.innerHeight ||
          document.documentElement.clientHeight ||
          document.body.clientHeight;
        swide = sw_min;
        shigh = sh_min;
      }

      window.onscroll = set_scroll;
      function set_scroll() {
        sdown =
          window.pageYOffset ||
          document.documentElement.scrollTop ||
          document.body.scrollTop ||
          0;
        sleft =
          window.pageXOffset ||
          document.documentElement.scrollLeft ||
          document.body.scrollLeft ||
          0;
      }

      function createDiv(height, width) {
        var div = document.createElement("div");
        div.style.position = "absolute";
        div.style.height = height;
        div.style.width = width;
        div.style.overflow = "hidden";
        div.style.backgroundColor = "transparent";
        return div;
      }
    </script>
  </head>

  <body>
    <div id="wrapper">
      <canvas id="birthday__matrix" aria-hidden="true"></canvas>

      <div class="countdown__screen" aria-live="polite">
        <strong id="countdown__number">3</strong>
      </div>

      <div class="flag__birthday">
        <img
          src="./Images/1.png"
          alt="Birthday banner decoration"
          width="350"
          class="flag__left"
        />
        <img
          src="./Images/1.png"
          alt="Birthday banner decoration"
          width="350"
          class="flag__right"
        />
      </div>

      <div class="content">
        <div class="left">
          <div class="title">
            <h1 class="happy">
              <span style="--t: 4s">H</span>
              <span style="--t: 4.2s">a</span>
              <span style="--t: 4.4s">p</span>
              <span style="--t: 4.6s">p</span>
              <span style="--t: 4.8s">y</span>
            </h1>
            <h1 class="birthday">
              <span style="--t: 5s">B</span>
              <span style="--t: 5.2s">i</span>
              <span style="--t: 5.4s">r</span>
              <span style="--t: 5.6s">t</span>
              <span style="--t: 5.8s">h</span>
              <span style="--t: 6s">d</span>
              <span style="--t: 6.2s">a</span>
              <span style="--t: 6.4s">y</span>
            </h1>
            <div class="hat">
              <img src="./Images/hat.png" alt="Party hat" width="130" />
            </div>
          </div>

          <div class="date__of__birth">
            <span></span>
          </div>

          <div class="actions">
            <button id="btn__letter" aria-label="Open birthday letter">
              Open your letter
              <i class="fa-regular fa-envelope"></i>
            </button>
          </div>
        </div>

        <div class="right">
          <div class="box__account">
            <div class="image">
              <img src="./Images/friend.jpeg" alt="Portrait of Kirtan" />
            </div>
            <div class="name">
              <i class="fa-solid fa-star"></i>
              <span>Kirtan</span>
              <i class="fa-solid fa-star"></i>
            </div>
            <div class="balloon_one">
              <img width="100px" src="./Images/balloon1.png" alt="Birthday balloon" />
            </div>
            <div class="balloon_two">
              <img width="100px" src="./Images/balloon2.png" alt="Birthday balloon" />
            </div>
          </div>

          <div class="cricle">
            <div class="text__cricle">
              <span style="--i: 1">h</span>
              <span style="--i: 2">a</span>
              <span style="--i: 3">p</span>
              <span style="--i: 4">p</span>
              <span style="--i: 5">y</span>
              <span style="--i: 6">-</span>
              <span style="--i: 7">b</span>
              <span style="--i: 8">i</span>
              <span style="--i: 9">r</span>
              <span style="--i: 10">t</span>
              <span style="--i: 11">h</span>
              <span style="--i: 12">d</span>
              <span style="--i: 13">a</span>
              <span style="--i: 14">y</span>
              <span style="--i: 15">-</span>
            </div>
            <i class="fa-solid fa-cake-candles"></i>
          </div>
        </div>
      </div>

      <div class="decorate_star star1" style="--t: 15s"></div>
      <div class="decorate_star star2" style="--t: 15.2s"></div>
      <div class="decorate_star star3" style="--t: 15.4s"></div>
      <div class="decorate_star star4" style="--t: 15.6s"></div>
      <div class="decorate_star star5" style="--t: 15.8s"></div>

      <div class="decorate_flower--one" style="--t: 15s">
        <img width="20" src="./Images/decorate_flower.png" alt="" />
      </div>
      <div class="decorate_flower--two" style="--t: 15.3s">
        <img width="20" src="./Images/decorate_flower.png" alt="" />
      </div>
      <div class="decorate_flower--three" style="--t: 15.6s">
        <img width="20" src="./Images/decorate_flower.png" alt="" />
      </div>

      <div class="decorate_bottom">
        <img src="./Images/decorate.png" alt="" width="100" />
      </div>
      <div class="smiley__icon">
        <img src="./Images/smiley_icon.png" alt="" width="100" />
      </div>

      <div class="box__letter">
        <div class="letter__border">
          <div class="letter">
            <div class="title__letter"></div>
            <div class="content__letter">
              <div class="left">
                <img
                  id="friend__img"
                  src="./Images/friend2.jpeg"
                  alt="Kirtan smiling"
                />
                <span class="sparkle sparkle_1" style="--t: 0.2s">&#10022;</span>
                <span class="sparkle sparkle_2" style="--t: 0.4s">&#10038;</span>
                <span class="sparkle sparkle_3" style="--t: 0.6s">&#10022;</span>
                <span class="sparkle sparkle_4" style="--t: 0.8s">&#10038;</span>
              </div>
              <div class="right">
                <div class="text__letter">
                  <p></p>
                </div>
                <img
                  id="mewmew"
                  width="80"
                  src="./Images/mewmew.gif"
                  alt="Cute animated cat"
                />
              </div>
            </div>
          </div>
          <div class="close">
            <i class="fa-solid fa-xmark"></i>
          </div>
        </div>
      </div>

      <audio
        id="birthday__music"
        src="./aud.mp3"
        preload="auto"
        autoplay
        loop
        muted
        playsinline
      ></audio>
    </div>

    <script>
      let datetxt = "3 May 2006";
      let datatxtletter =
        "You are a truly special friend. Today, I wish you endless laughs, good health, big wins, and the kind of happiness that follows you everywhere. May this year bring new adventures, strong memories, and many more celebrations together. Happy birthday, Kirtan! \uD83C\uDF89";
      let titleLetter = "To My Friend";
      let charArrDate = datetxt.split("");
      let charArrDateLetter = datatxtletter.split("");
      let charArrTitle = titleLetter.split("");
      let currentIndex = 0;
      let currentIndexLetter = 0;
      let currentIndexTitle = 0;
      let date__of__birth = document.querySelector(".date__of__birth span");
      let text__letter = document.querySelector(".text__letter p");
      let titleLetterElement = document.querySelector(".title__letter");
      let friendImage = document.querySelector("#friend__img");
      let mewmew = document.querySelector("#mewmew");
      let floatingSparkles = document.querySelectorAll(".content__letter .sparkle");
      let boxLetter = document.querySelector(".box__letter");
      let letterBorder = document.querySelector(".letter__border");
      let birthdayMusic = document.querySelector("#birthday__music");
      let matrixCanvas = document.querySelector("#birthday__matrix");
      let countdownScreen = document.querySelector(".countdown__screen");
      let countdownNumber = document.querySelector("#countdown__number");
      let isMusicPlaying = false;
      let countdownAudioContext;
      let timeDatetxt;
      let matrixContext = matrixCanvas.getContext("2d");
      let matrixColumns = [];
      let matrixFontSize = 18;
      let matrixWords = ["HAPPYBIRTHDAY", "HAPPYBIRTHDAYKIRTAN"];

      function resetLetterState() {
        clearInterval(intervalContent);
        clearInterval(intervalTitle);
        titleLetterElement.textContent = "";
        text__letter.textContent = "";
        currentIndexLetter = 0;
        currentIndexTitle = 0;
        friendImage.classList.remove("animationOp");
        mewmew.classList.remove("animationOp");
        floatingSparkles.forEach(function (sparkle) {
          sparkle.classList.remove("animation");
        });
      }

      function closeLetter() {
        resetLetterState();
        $(".box__letter").slideUp();
        $(".letter__border").slideUp();
      }

      function prepareBirthdayMusic() {
        if (isMusicPlaying) return;

        birthdayMusic.muted = true;
        birthdayMusic.volume = 0;
        birthdayMusic.play().then(function () {
          isMusicPlaying = true;
        }).catch(function () {
          isMusicPlaying = false;
        });
      }

      function fadeInBirthdayMusic() {
        birthdayMusic.muted = false;
        birthdayMusic.volume = 0;
        birthdayMusic.play().then(function () {
          isMusicPlaying = true;
        }).catch(function () {
          isMusicPlaying = false;
        });

        let targetVolume = 0.58;
        let fadeStep = setInterval(function () {
          if (birthdayMusic.volume >= targetVolume - 0.03) {
            birthdayMusic.volume = targetVolume;
            clearInterval(fadeStep);
          } else {
            birthdayMusic.volume = Math.min(targetVolume, birthdayMusic.volume + 0.04);
          }
        }, 70);
      }

      function playCountdownBeep(isFinalBeep) {
        try {
          countdownAudioContext =
            countdownAudioContext ||
            new (window.AudioContext || window.webkitAudioContext)();
          countdownAudioContext.resume();

          let oscillator = countdownAudioContext.createOscillator();
          let gainNode = countdownAudioContext.createGain();
          let now = countdownAudioContext.currentTime;

          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(isFinalBeep ? 740 : 520, now);
          gainNode.gain.setValueAtTime(0.0001, now);
          gainNode.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

          oscillator.connect(gainNode);
          gainNode.connect(countdownAudioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.24);
        } catch (error) {
          // Some browsers block generated audio until the first user gesture.
        }
      }

      prepareBirthdayMusic();

      window.addEventListener("load", function () {
        prepareBirthdayMusic();
      });

      function resizeBirthdayMatrix() {
        let pixelRatio = window.devicePixelRatio || 1;
        matrixCanvas.width = window.innerWidth * pixelRatio;
        matrixCanvas.height = window.innerHeight * pixelRatio;
        matrixCanvas.style.width = window.innerWidth + "px";
        matrixCanvas.style.height = window.innerHeight + "px";
        matrixContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        matrixFontSize = window.innerWidth < 520 ? 9 : 11;
        matrixColumns = Array.from(
          { length: Math.ceil(window.innerWidth / matrixFontSize) + 8 },
          function () {
            return {
              y: Math.random() * window.innerHeight,
              speed: 0.55 + Math.random() * 1.25,
              word: matrixWords[Math.floor(Math.random() * matrixWords.length)],
            };
          },
        );
      }

      function drawBirthdayMatrix() {
        matrixContext.fillStyle = "rgba(5, 3, 10, 0.2)";
        matrixContext.fillRect(0, 0, window.innerWidth, window.innerHeight);
        matrixContext.font = matrixFontSize + "px monospace";
        matrixContext.textAlign = "center";

        matrixColumns.forEach(function (column, index) {
          let x = index * matrixFontSize + matrixFontSize / 2;
          let letters = column.word.split("");

          letters.forEach(function (letter, letterIndex) {
            let y = column.y + letterIndex * matrixFontSize;
            let alpha = Math.max(0.38, 0.95 - letterIndex * 0.045);
            matrixContext.fillStyle =
              letterIndex === 0
                ? "rgba(255, 222, 250, " + alpha + ")"
                : "rgba(255, 164, 232, " + alpha + ")";
            matrixContext.fillText(letter, x, y);
          });

          column.y -= column.speed;
          if (column.y < -column.word.length * matrixFontSize) {
            column.y = window.innerHeight + Math.random() * 240;
            column.speed = 0.55 + Math.random() * 1.25;
            column.word = matrixWords[Math.floor(Math.random() * matrixWords.length)];
          }
        });

        requestAnimationFrame(drawBirthdayMatrix);
      }

      function startCountdown() {
        let values = ["3", "2", "1"];
        let index = 0;
        playCountdownBeep(false);

        let countdownTimer = setInterval(function () {
          index++;
          if (index < values.length) {
            countdownNumber.textContent = values[index];
            playCountdownBeep(index === values.length - 1);
          } else {
            clearInterval(countdownTimer);
            countdownScreen.classList.add("is-hidden");
            fadeInBirthdayMusic();
          }
        }, 1000);
      }

      resizeBirthdayMatrix();
      drawBirthdayMatrix();
      startCountdown();
      window.addEventListener("resize", resizeBirthdayMatrix);

      setTimeout(function () {
        timeDatetxt = setInterval(function () {
          if (currentIndex < charArrDate.length) {
            date__of__birth.textContent += charArrDate[currentIndex];
            currentIndex++;
          } else {
            let i = document.createElement("i");
            i.className = "fa-solid fa-star";
            document.querySelector(".date__of__birth").prepend(i);
            document
              .querySelector(".date__of__birth")
              .appendChild(i.cloneNode(true));
            clearInterval(timeDatetxt);
          }
        }, 100);
      }, 12000);

      var intervalContent;
      var intervalTitle;

      $("#btn__letter").on("click", function () {
        fadeInBirthdayMusic();
        resetLetterState();
        $(".box__letter").slideDown();
        setTimeout(function () {
          $(".letter__border").slideDown();
          friendImage.classList.add("animationOp");
          mewmew.classList.add("animationOp");
          floatingSparkles.forEach(function (sparkle) {
            sparkle.classList.add("animation");
          });
        }, 1000);
        setTimeout(function () {
          intervalTitle = setInterval(function () {
            if (currentIndexTitle < charArrTitle.length) {
              titleLetterElement.textContent += charArrTitle[currentIndexTitle];
              let i = document.createElement("i");
              i.className = "fa-solid fa-star";
              titleLetterElement.appendChild(i);
              currentIndexTitle++;
            } else {
              clearInterval(intervalTitle);
            }
          }, 100);
        }, 2000);
        setTimeout(function () {
          intervalContent = setInterval(function () {
            if (currentIndexLetter < charArrDateLetter.length) {
              text__letter.textContent += charArrDateLetter[currentIndexLetter];
              currentIndexLetter++;
            } else {
              clearInterval(intervalContent);
            }
          }, 50);
        }, 3000);
      });

      document.addEventListener("click", fadeInBirthdayMusic, { once: true });

      $(".close").on("click", function () {
        closeLetter();
      });

      boxLetter.addEventListener("click", function (event) {
        if (!letterBorder.contains(event.target)) {
          closeLetter();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeLetter();
        }
      });
    </script>
  </body>
</html>
